<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>TV Shows and Movies Search App</title>
</head>
<body>
    <div class="heading">
            <h1>🎬 Movie Search</h1>
    </div>
    <section class="text-part">
        <p>Quickly search for your favorite movies and TV shows. Get posters, release years, and direct 
            <span class="highlight" >IMDb</span> links. Type a title and press 
            <span class="highlight">Enter</span> to see results instantly!</p>
        <p>Click the refresh button to reload the default popular selections.</p>    
    </section>

    <div class="input-field">
        <input id="search" type="text" placeholder="Search for a movie... ">
        <button id="btn">
            <img id="btn-img" src="refresh.png " alt="Reload">
        </button>
    </div>

    <div class="container" id="results" >
        
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="movies.js" ></script>
    <script src="script.js" ></script>
</body>
</html>
